<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ランニングイベント手帳</title>
<style>
/* =====================================================================
   デザイントークン（見た目を変えるときは、まずここだけを編集します）
   ダークモードを足すときは、下の :root[data-theme="dark"] に同じ変数を上書きしてください
   ===================================================================== */
:root {
  /* 色 */
  --color-bg: #f6f7f5;
  --color-surface: #ffffff;
  --color-surface-sub: #eef1ec;
  --color-text: #1f2a24;
  --color-text-muted: #5b6760;
  --color-border: #d5dbd2;
  --color-primary: #1f6f4a;
  --color-primary-contrast: #ffffff;
  --color-primary-soft: #e1f0e8;
  --color-ok: #1f6f4a;
  --color-warn: #8a5a00;
  --color-warn-bg: #fff3d6;
  --color-danger: #a12626;
  --color-danger-bg: #fde6e4;
  --color-info-bg: #e6eef8;
  --color-info: #1d4e89;
  --color-overlay: rgba(20, 28, 24, 0.45);
  /* 文字 */
  --font-base: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-size-xs: 0.75rem;
  --font-size-s: 0.875rem;
  --font-size-m: 1rem;
  --font-size-l: 1.25rem;
  --font-size-xl: 1.75rem;
  --font-size-xxl: 2.5rem;
  --line-height: 1.6;
  --weight-bold: 700;
  /* 余白・形 */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --shadow-1: 0 1px 3px rgba(20, 28, 24, 0.12);
  --shadow-2: 0 -4px 24px rgba(20, 28, 24, 0.2);
  --border-width: 1px;
  /* サイズ */
  --tap-size: 48px;
  --nav-height: 60px;
  --content-width: 720px;
}
/* :root[data-theme="dark"] { --color-bg: #...; ...（あとで追加） } */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-base); font-size: var(--font-size-m); line-height: var(--line-height);
  padding-bottom: calc(var(--nav-height) + var(--space-5));
}
body.modal-open { overflow: hidden; }
h1, h2, h3, h4 { margin: 0 0 var(--space-2); line-height: 1.35; }
h2 { font-size: var(--font-size-l); }
h3 { font-size: var(--font-size-m); margin-top: var(--space-5); }
h4 { font-size: var(--font-size-m); }
p { margin: 0 0 var(--space-2); }
.small { font-size: var(--font-size-s); }
.xs { font-size: var(--font-size-xs); }
.muted { color: var(--color-text-muted); }
.center { text-align: center; }
.pre { white-space: pre-line; }
.code { white-space: pre-wrap; overflow-x: auto; background: var(--color-surface-sub); padding: var(--space-3); border-radius: var(--radius-s); font-family: var(--font-mono); font-size: var(--font-size-xs); }

.app { max-width: var(--content-width); margin: 0 auto; padding: var(--space-4); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); }
.topbar h1 { font-size: var(--font-size-l); margin: 0; }

/* ナビ */
.nav { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav-height); background: var(--color-surface);
  border-top: var(--border-width) solid var(--color-border); display: flex; z-index: 10; }
.nav button { flex: 1; border: 0; background: transparent; color: var(--color-text-muted); font: inherit; font-size: var(--font-size-xs);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--tap-size); cursor: pointer; }
.nav button .ico { font-size: var(--font-size-l); line-height: 1; }
.nav button[aria-current="page"] { color: var(--color-primary); font-weight: var(--weight-bold); background: var(--color-primary-soft); }

/* カード */
.card { background: var(--color-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-m);
  padding: var(--space-4); margin-bottom: var(--space-3); box-shadow: var(--shadow-1); }
.card.tap { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; display: block; }
.card.is-done { background: var(--color-primary-soft); }
.card.advice h4 { font-size: var(--font-size-s); color: var(--color-text-muted); margin-bottom: var(--space-1); }
.card.banner { background: var(--color-warn-bg); color: var(--color-warn); border-color: var(--color-warn); font-weight: var(--weight-bold); }
.card.notice-warn { background: var(--color-warn-bg); color: var(--color-warn); border-color: var(--color-warn); }
.card.notice-danger { background: var(--color-danger-bg); color: var(--color-danger); border-color: var(--color-danger); }
.card.notice-info { background: var(--color-info-bg); color: var(--color-info); border-color: var(--color-info); }
.card ul { margin: 0; padding-left: 1.2em; }
.card li { margin-bottom: var(--space-1); }

.hero { text-align: center; }
.hero .count { font-size: var(--font-size-xxl); font-weight: var(--weight-bold); color: var(--color-primary); line-height: 1.2; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-3); font-size: var(--font-size-s); margin-top: var(--space-3); }
.kv dt { color: var(--color-text-muted); } .kv dd { margin: 0; }

/* ボタン・フォーム */
.btn { min-height: var(--tap-size); padding: 0 var(--space-4); border-radius: var(--radius-s); border: var(--border-width) solid var(--color-primary);
  background: var(--color-surface); color: var(--color-primary); font: inherit; font-weight: var(--weight-bold); cursor: pointer; }
.btn.primary { background: var(--color-primary); color: var(--color-primary-contrast); }
.btn.danger { border-color: var(--color-danger); color: var(--color-danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { min-height: 40px; font-size: var(--font-size-s); padding: 0 var(--space-3); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card.tap:focus-visible, .nav button:focus-visible {
  outline: 3px solid var(--color-info); outline-offset: 2px; }
.btns { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.btns .grow { flex: 1; }
label { display: block; font-size: var(--font-size-s); color: var(--color-text-muted); margin-bottom: var(--space-3); }
label.check { display: flex; align-items: center; gap: var(--space-3); color: var(--color-text); font-size: var(--font-size-m); min-height: var(--tap-size); }
input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--color-primary); flex: none; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input:not([type]), select, textarea {
  display: block; width: 100%; min-height: var(--tap-size); margin-top: var(--space-1); padding: var(--space-2) var(--space-3);
  font: inherit; font-size: 16px; color: var(--color-text); background: var(--color-surface);
  border: var(--border-width) solid var(--color-border); border-radius: var(--radius-s); }
textarea { min-height: 80px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.row { display: flex; gap: var(--space-2); align-items: flex-end; }
.row > :first-child { flex: 1; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }

/* バッジ・ステータス */
.badge { display: inline-block; padding: 2px var(--space-3); border-radius: var(--radius-l); font-size: var(--font-size-xs);
  font-weight: var(--weight-bold); background: var(--color-surface-sub); color: var(--color-text); border: var(--border-width) solid var(--color-border); }
.badge.t-race { background: var(--color-primary); color: var(--color-primary-contrast); border-color: var(--color-primary); }
.badge.t-rest { color: var(--color-text-muted); }
.badge.today { background: var(--color-info-bg); color: var(--color-info); border-color: var(--color-info); }
.badge.auto { background: var(--color-info-bg); color: var(--color-info); }
.status { font-weight: var(--weight-bold); font-size: var(--font-size-s); }
.status.lv-warn { color: var(--color-warn); } .status.lv-over { color: var(--color-danger); } .status.lv-ok { color: var(--color-ok); }
.progress { height: 12px; background: var(--color-surface-sub); border-radius: var(--radius-l); overflow: hidden; border: var(--border-width) solid var(--color-border); margin: var(--space-2) 0; }
.progress-fill { display: block; height: 100%; background: var(--color-ok); }
.progress-fill.lv-warn { background: var(--color-warn); } .progress-fill.lv-over { background: var(--color-danger); }

/* 週表示 */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
.weeknav .label { text-align: center; font-weight: var(--weight-bold); }
.day-head { display: flex; align-items: center; justify-content: space-between; margin: var(--space-4) 0 var(--space-2); }
.day-head .d { font-weight: var(--weight-bold); }
.wk-line { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }
.wk-main { font-weight: var(--weight-bold); }
.wk-sub { color: var(--color-text-muted); font-size: var(--font-size-s); }
.empty-day { color: var(--color-text-muted); font-size: var(--font-size-s); padding: var(--space-2) 0; }

/* タイムライン・ペース表 */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; gap: var(--space-4); align-items: baseline; padding: var(--space-3) 0; border-bottom: var(--border-width) solid var(--color-border); }
.timeline .time { font-size: var(--font-size-xl); font-weight: var(--weight-bold); min-width: 4.5ch; font-variant-numeric: tabular-nums; }
.timeline .title { font-size: var(--font-size-l); flex: 1; text-align: left; background: none; border: 0; padding: 0; font-family: inherit; color: inherit; cursor: pointer; }
.pace-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-s); }
.pace-table th, .pace-table td { text-align: left; padding: var(--space-2); border-bottom: var(--border-width) solid var(--color-border); vertical-align: top; }
.pace-table td.num { font-variant-numeric: tabular-nums; font-weight: var(--weight-bold); }
.mark { display: inline-block; margin: 0 var(--space-1) var(--space-1) 0; padding: 0 var(--space-2); border-radius: var(--radius-s); font-size: var(--font-size-xs); font-weight: var(--weight-bold); }
.mark.fuel { background: var(--color-warn-bg); color: var(--color-warn); }
.mark.water { background: var(--color-info-bg); color: var(--color-info); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-2) 0; }
.chip { padding: var(--space-1) var(--space-3); border-radius: var(--radius-l); background: var(--color-surface-sub); font-size: var(--font-size-s); }
.pack { display: flex; align-items: center; gap: var(--space-2); border-bottom: var(--border-width) solid var(--color-border); }
.pack .chk { flex: 1; display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap-size); background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.pack.checked .txt { text-decoration: line-through; color: var(--color-text-muted); }

/* シート（モーダル） */
.sheet-wrap[hidden] { display: none; }
.sheet-back { position: fixed; inset: 0; background: var(--color-overlay); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; display: flex; flex-direction: column; z-index: 21;
  background: var(--color-bg); border-radius: var(--radius-l) var(--radius-l) 0 0; box-shadow: var(--shadow-2); max-width: var(--content-width); margin: 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: var(--border-width) solid var(--color-border); }
.sheet-head h2 { margin: 0; }
.sheet-body { overflow-y: auto; padding: var(--space-4); padding-bottom: var(--space-6); -webkit-overflow-scrolling: touch; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-height) + var(--space-4)); z-index: 30;
  background: var(--color-text); color: var(--color-bg); padding: var(--space-3) var(--space-4); border-radius: var(--radius-m); max-width: 90vw; font-size: var(--font-size-s); }
.toast[hidden] { display: none; }
.wxbox { border: var(--border-width) dashed var(--color-border); border-radius: var(--radius-m); padding: var(--space-3); margin-bottom: var(--space-3); background: var(--color-surface); }
.placeres button { display: block; width: 100%; text-align: left; margin-top: var(--space-1); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--tap-size); }
.disclaimer { font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: var(--space-4); }

@media (min-width: 720px) {
  .sheet { bottom: var(--space-5); border-radius: var(--radius-l); }
}

/* 練習メニュー */
.card.is-quality { border-left: 4px solid var(--color-primary); }
.wk-strength { color: var(--color-text-muted); }
.care-line { font-size: var(--font-size-s); color: var(--color-text-muted); padding: 0 0 var(--space-1); }
.bd-day { margin-bottom: var(--space-3); }
details.card > summary { cursor: pointer; font-weight: var(--weight-bold); min-height: var(--tap-size); display: flex; align-items: center; }
.care-ex { padding: var(--space-2) 0; border-top: var(--border-width) solid var(--color-border); }
code { font-family: var(--font-mono); font-size: var(--font-size-xs); word-break: break-all; }
.topbar .btns { display: flex; gap: var(--space-2); margin: 0; }

</style>
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ラン手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<main class="app" id="main"></main>
<nav class="nav" id="nav" aria-label="メニュー"></nav>
<div class="sheet-wrap" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* =====================================================================
   ロジック層（画面から独立。DOMには触れない）
   - CONFIG        : 調整できる設定値・文章データ
   - Dates/Fmt     : 日付・数値・ペース計算
   - Plan          : トレーニング計画の自動生成
   - Advice        : 栄養・水分・ウエアの提案
   - Shoes         : シューズ集計・判定
   - Weather       : 天気の取得と変換（設定オン＋同意があるときだけ通信）
   - Data          : 保存データの検証・書き出し・読み込み
   ===================================================================== */
const RE = (function () {
'use strict';

/* ---------------------------------------------------------------
   CONFIG：数字や文章はここで変更できます
   --------------------------------------------------------------- */
const CONFIG = {
  dataVersion: 1,
  storageKey: 'running_event_app_v1',
  weatherCacheKey: 'running_event_app_weather_cache_v1',

  eventTypes: {
    full: { label: 'フルマラソン', km: 42.195 },
    half: { label: 'ハーフマラソン', km: 21.0975 },
    '10k': { label: '10km', km: 10 },
    '5k': { label: '5km', km: 5 },
    fun: { label: 'ファンラン・その他（距離を入力）', km: null }
  },
  menuTypes: { jog: 'ジョグ', recovery: 'リカバリー', strides: '流し', tempo: 'ペース走', mp: 'MP', interval: 'インターバル', lsd: 'LSD', rest: '休養', race: '大会' },
  menu: { version: 1, maxDays: 400, qualityTypes: ['interval', 'tempo', 'mp', 'strides'], recoveryTagRatio: 0.85 },
  levels: { beginner: '初心者', intermediate: '中級者', advanced: '上級者' },
  shoeUses: { training: '練習用', speed: 'スピード練習用', race: '大会用', both: '兼用' },
  shoeStatuses: { active: '使用中', stored: '保管', retired: '引退' },
  skyLabels: { sunny: '晴れ', cloudy: '曇り', rain: '雨' },
  windLabels: { weak: '弱い', strong: '強い' },
  levelTempLabels: { cold: '寒い', ok: 'ちょうどよい', hot: '暑い' },
  levelTempRepresentative: { cold: 4, ok: 14, hot: 27 }, // 簡易選択のときに使う代表気温(℃)

  /* ペース：基準ペースに足す秒数/km。範囲は説明用、offsets が実際に使う値 */
  pace: {
    offsets: { jog: 75, recovery: 105, lsd: 90, tempo: 0, mp: 0, interval: -22, race: 0 },
    ranges: { jog: [60, 90], lsd: [75, 105], tempo: [-5, 10], interval: [-30, -15] },
    roundToSec: 5,
    riegelExponent: 1.06,
    // 目標・直近タイムが無いときの推定に使う「10kmの目安タイム(秒)」
    level10kSec: { beginner: 3900, intermediate: 3120, advanced: 2520 }
  },

  /* トレーニング計画 */
  plan: {
    peakWeeklyKm: {
      full: { beginner: 50, intermediate: 70, advanced: 90 },
      half: { beginner: 35, intermediate: 45, advanced: 60 },
      '10k': { beginner: 25, intermediate: 35, advanced: 45 },
      '5k': { beginner: 18, intermediate: 28, advanced: 38 }
    },
    longRunMaxKm: {
      full: { beginner: 28, intermediate: 32, advanced: 35 },
      half: { beginner: 15, intermediate: 18, advanced: 21 },
      '10k': { beginner: 12, intermediate: 14, advanced: 16 },
      '5k': { beginner: 8, intermediate: 10, advanced: 12 }
    },
    minWeeks: { full: 8, half: 6, '10k': 4, '5k': 3 },
    taperWeeks: { full: 2, half: 1, '10k': 1, '5k': 1 },
    taperRatios: { 1: [0.6], 2: [0.7, 0.5] },
    recoveryEvery: 4,        // 3週増やして4週目は軽く
    recoveryRatio: 0.75,
    maxGrowthPerWeek: 0.10,  // ピーク距離の上限を決める増加率の目安
    minWeeklyKm: 6,
    minKmPerRunDay: 3,       // 開始時の週間距離の下限 = 走る日数 × この値
    minSessionKm: 3,
    longTaperCapRatio: 0.7,
    weights: { long: 3, q1: 2, q2: 2, easy: 1.5 },
    // 曜日(0=日〜6=土)と役割。走る日数ごとの配置
    templates: {
      2: [{ wd: 3, role: 'q1' }, { wd: 0, role: 'long' }],
      3: [{ wd: 2, role: 'easy' }, { wd: 4, role: 'q1' }, { wd: 0, role: 'long' }],
      4: [{ wd: 2, role: 'easy' }, { wd: 4, role: 'q1' }, { wd: 6, role: 'easy' }, { wd: 0, role: 'long' }],
      5: [{ wd: 2, role: 'q1' }, { wd: 3, role: 'easy' }, { wd: 5, role: 'q2' }, { wd: 6, role: 'easy' }, { wd: 0, role: 'long' }],
      6: [{ wd: 1, role: 'easy' }, { wd: 2, role: 'q1' }, { wd: 4, role: 'easy' }, { wd: 5, role: 'q2' }, { wd: 6, role: 'easy' }, { wd: 0, role: 'long' }]
    }
  },

  /* 栄養・水分の数値 */
  fuel: { thresholdMin: 60, firstAtMin: 45, intervalMin: 40, endBufferMin: 15, carbPerGelG: 25, carbPerHourG: [30, 60],
          carbLoadMinKm: 21, breakfastBeforeStartH: 3, preWaterBeforeStartH: 2 },
  hydration: {
    hotTempC: 25,
    normal: { intervalMin: 20, ml: [100, 150] },
    hot: { intervalMin: 15, ml: [150, 200] },
    defaultTempC: 15
  },
  wear: {
    effectiveTempOffset: 10, // 走ると体感は気温＋約10℃。下の段階はそれを前提にした服装
    tiers: [
      { below: 5, label: '5℃未満', upper: '長袖シャツ＋薄手ウインドブレーカー', lower: 'ロングタイツ',
        acc: ['手袋', 'ネックウォーマー／バフ', 'ニット帽またはイヤーバンド'], wait: ['捨ててよい上着', 'ごみ袋（防寒・風よけ）', '使い捨てカイロ'] },
      { below: 10, label: '5〜10℃', upper: '長袖シャツ（必要ならウインドブレーカー）', lower: 'ロングタイツまたはハーフタイツ',
        acc: ['薄手の手袋', 'ネックウォーマー／バフ'], wait: ['捨ててよい上着', 'ごみ袋（防寒・風よけ）'] },
      { below: 15, label: '10〜15℃', upper: '長袖シャツ、または半袖＋アームカバー', lower: 'ショーツ（寒がりならハーフタイツ）',
        acc: ['アームカバー'], wait: ['捨ててよい上着'] },
      { below: 20, label: '15〜20℃', upper: '半袖シャツ', lower: 'ショーツ',
        acc: ['キャップ'], wait: ['待ち時間が長いなら薄手の上着'] },

/* ---------------------------------------------------------------
   日付・数値ユーティリティ
   --------------------------------------------------------------- */
const pad = n => (n < 10 ? '0' : '') + n;
function dayNum(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return NaN;
  const n = Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000);
  return fromDayNum(n) === s ? n : NaN;
}
function fromDayNum(n) {
  const d = new Date(n * 86400000);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}
const isValidDate = s => !isNaN(dayNum(s));
const weekdayOf = s => (((dayNum(s) + 4) % 7) + 7) % 7; // 0=日
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const addDays = (s, n) => fromDayNum(dayNum(s) + n);
const daysUntil = s => dayNum(s) - dayNum(todayStr());
function fmtMD(s) { if (!isValidDate(s)) return ''; const p = s.split('-'); return (+p[1]) + '/' + (+p[2]) + '(' + '日月火水木金土'[weekdayOf(s)] + ')'; }
function fmtFull(s) { if (!isValidDate(s)) return ''; const p = s.split('-'); return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日(' + '日月火水木金土'[weekdayOf(s)] + ')'; }
function mondayOf(s) { const wd = weekdayOf(s); return addDays(s, -((wd + 6) % 7)); }

function norm(s) {
  return String(s == null ? '' : s)
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/：/g, ':').replace(/[．。]/g, '.').replace(/\s+/g, '').replace(/\/km$/i, '');
}
function parseKm(s) { const t = norm(s).replace(/km$/i, ''); if (!/^\d+(\.\d+)?$/.test(t)) return null; const v = parseFloat(t); return v > 0 && v < 1000 ? v : null; }
function parsePace(s) {
  const m = /^(\d{1,2}):(\d{1,2})$/.exec(norm(s)); if (!m) return null;
  if (+m[2] >= 60) return null; const v = +m[1] * 60 + +m[2]; return v > 0 ? v : null;
}
function parseDuration(s) {
  const t = norm(s); let m, v = null;
  if ((m = /^(\d{1,3}):(\d{1,2}):(\d{1,2})$/.exec(t))) { if (+m[2] >= 60 || +m[3] >= 60) return null; v = +m[1] * 3600 + +m[2] * 60 + +m[3]; }
  else if ((m = /^(\d{1,3}):(\d{1,2})$/.exec(t))) { if (+m[2] >= 60) return null; v = +m[1] * 60 + +m[2]; }
  else if (/^\d+$/.test(t)) v = +t * 60;
  return v > 0 ? v : null;
}
const formatPace = sec => (sec > 0 && isFinite(sec)) ? Math.floor(Math.round(sec) / 60) + ':' + pad(Math.round(sec) % 60) : '';
function formatDuration(sec) {
  if (!(sec > 0) || !isFinite(sec)) return '';
  const t = Math.round(sec); return Math.floor(t / 3600) + ':' + pad(Math.floor(t % 3600 / 60)) + ':' + pad(t % 60);
}
const formatKm = km => (km > 0 && isFinite(km)) ? String(Math.round(km * 100) / 100) : '';
const roundHalf = x => Math.round(x * 2) / 2;

/* 距離・ペース・時間のうち2つから残り1つを計算。
   3つ揃っているときは「直近に触った2つ」を残し、もう1つを再計算 */
function solveTriad(v, editedOrder) {
  const keys = ['km', 'pace', 'dur'];
  const out = { km: v.km || null, pace: v.pace || null, dur: v.dur || null };
  const filled = keys.filter(k => out[k] > 0);
  if (filled.length < 2) return out;
  let target;
  if (filled.length === 2) target = keys.find(k => !filled.includes(k));
  else {
    const recent = [];
    for (let i = (editedOrder || []).length - 1; i >= 0 && recent.length < 2; i--) if (!recent.includes(editedOrder[i])) recent.push(editedOrder[i]);
    const cand = keys.filter(k => !recent.includes(k));
    target = cand.includes('dur') ? 'dur' : cand[0];
  }
  if (target === 'dur') out.dur = Math.round(out.km * out.pace);
  else if (target === 'pace') out.pace = Math.round(out.dur / out.km);
  else out.km = Math.round(out.dur / out.pace * 100) / 100;
  return out;
}
const eventKm = ev => (ev && ev.distanceKm > 0) ? ev.distanceKm : null;
function predictSec(sec1, km1, km2) { return sec1 * Math.pow(km2 / km1, CONFIG.pace.riegelExponent); }
function bucketOf(km) { return km <= 7.5 ? '5k' : km <= 15 ? '10k' : km <= 30 ? 'half' : 'full'; }

/* 基準ペース（目標 → 直近タイム → 走力レベルの順に採用） */
function basePace(p) {
  const km = p.distanceKm;
  if (!(km > 0)) return null;
  if (p.goalSec > 0) return { paceSec: p.goalSec / km, source: 'goal' };
  if (p.recentSec > 0 && p.recentKm > 0) return { paceSec: predictSec(p.recentSec, p.recentKm, km) / km, source: 'recent' };
  const lv = CONFIG.pace.level10kSec[p.level] || CONFIG.pace.level10kSec.intermediate;
  return { paceSec: predictSec(lv, 10, km) / km, source: 'level' };
}
function paceFor(type, base) {
  if (!(base > 0) || type === 'rest') return null;
  const off = CONFIG.pace.offsets[type]; if (off == null) return null;
  const r = CONFIG.pace.roundToSec; return Math.round((base + off) / r) * r;
}

/* ---------------------------------------------------------------
   トレーニング計画の自動生成
   --------------------------------------------------------------- */
function menuMemo(type, km, phase) {
  if (type === 'interval') { const reps = Math.max(3, Math.min(10, Math.round((km - 3) / 1.4))); return '1000m×' + reps + '本（つなぎ400mジョグ）＋ウォームアップ・クールダウン'; }
  if (type === 'tempo') { const main = Math.max(2, Math.round((km - 3) * 0.7)); return 'ウォームアップ後、' + main + 'kmをペース走' + (phase === 'base' ? '（ゆったりめ、無理せず）' : ''); }
  if (type === 'lsd') return '会話できるペースでゆっくり長く';
  if (type === 'jog') return '楽に会話できる強さで';
  return '';
}
function allocWeek(vol, tpl, cap) {
  const W = CONFIG.plan.weights;
  const ws = tpl.map(t => W[t.role]); const sum = ws.reduce((a, b) => a + b, 0);
  const km = ws.map(w => vol * w / sum);
  const li = tpl.findIndex(t => t.role === 'long');
  if (li >= 0 && km[li] > cap) {
    const ex = km[li] - cap; km[li] = cap;
    const osum = ws.reduce((a, w, i) => a + (i === li ? 0 : w), 0);
    if (osum > 0) km.forEach((x, i) => { if (i !== li) km[i] += ex * ws[i] / osum; });
  }
  return km.map(x => Math.max(CONFIG.plan.minSessionKm, roundHalf(x)));
}

function generatePlan(p) {
  const P = CONFIG.plan, warnings = [];
  const s = dayNum(p.startDate), e = dayNum(p.eventDate);
  if (isNaN(s) || isNaN(e)) return { error: '日付が正しくありません。' };
  if (!(p.distanceKm > 0)) return { error: '種目の距離が正しくありません。' };
  const days = e - s;
  if (days < 1) return { error: '計画の開始日は、開催日より前にしてください。' };
  const D = Math.max(2, Math.min(6, Math.round(p.daysPerWeek) || 3));
  const level = CONFIG.levels[p.level] ? p.level : 'beginner';
  const bucket = bucketOf(p.distanceKm);
  const W = Math.ceil(days / 7);
  const minW = P.minWeeks[bucket];
  if (W < minW) warnings.push('期間が短めです（約' + W + '週間。目安は' + minW + '週間以上）。無理のない範囲で、ピーク距離を控えめにした計画にしています。');
  let T = Math.min(P.taperWeeks[bucket], Math.max(1, Math.floor(W / 3)));
  const N = W - T;
  const recCount = N >= 3 ? Math.floor((N - 1) / P.recoveryEvery) : 0;
  const V0 = Math.max(parseFloat(p.currentWeeklyKm) || 0, P.minWeeklyKm, D * P.minKmPerRunDay);
  const growthCap = V0 * Math.pow(1 + P.maxGrowthPerWeek, Math.max(N - recCount - 1, 0));
  const peak = Math.max(V0, Math.min(P.peakWeeklyKm[bucket][level], growthCap));
  if (peak < P.peakWeeklyKm[bucket][level] * 0.7) warnings.push('現在の週間距離から無理なく増やせる範囲で計画しています（ピーク約' + Math.round(peak) + 'km/週）。');

  // 週ごとの距離と時期
  const vols = [], phases = [], isRec = [];
  const nonRecIdx = [];
  for (let k = 0; k < N; k++) { const rec = N >= 3 && (k + 1) % P.recoveryEvery === 0 && k !== N - 1; isRec.push(rec); if (!rec) nonRecIdx.push(k); }
  const baseWeeks = Math.ceil(N / 2);
  for (let k = 0; k < N; k++) {
    phases.push(k < baseWeeks ? 'base' : 'build');
    if (isRec[k]) vols.push(roundHalf(vols[k - 1] * P.recoveryRatio));
    else {
      const r = nonRecIdx.indexOf(k), R = nonRecIdx.length;
      vols.push(roundHalf(R > 1 ? V0 + (peak - V0) * r / (R - 1) : V0));
    }
  }
  const lastPeak = vols.length ? Math.max.apply(null, vols) : V0;
  const ratios = P.taperRatios[T] || P.taperRatios[1];
  for (let i = 0; i < T; i++) { vols.push(roundHalf(lastPeak * ratios[Math.min(i, ratios.length - 1)])); phases.push('taper'); isRec.push(false); }

  const base = basePace({ distanceKm: p.distanceKm, goalSec: p.goalSec, recentSec: p.recentSec, recentKm: p.recentKm, level });
  const tpl = P.templates[D];
  const roleByWd = {}; tpl.forEach(t => { roleByWd[t.wd] = t.role; });
  const longMax = P.longRunMaxKm[bucket][level];
  const alloc = vols.map((v, w) => allocWeek(v, tpl, phases[w] === 'taper' ? longMax * P.longTaperCapRatio : longMax));

  const items = [];
  for (let d = s; d < e; d++) {
    const date = fromDayNum(d), w = Math.floor((d - s) / 7), wd = weekdayOf(date), phase = phases[w];
    let role = roleByWd[wd], type = 'rest', km = 0, memo = '';
    if (role) {
      const idx = tpl.findIndex(t => t.wd === wd); km = alloc[w][idx];
      if (role === 'long') type = 'lsd';
      else if (role === 'easy') type = 'jog';
      else if (role === 'q1') type = phase === 'build' ? ((level === 'beginner' && w % 2 === 1) ? 'tempo' : 'interval') : 'tempo';
      else type = phase === 'build' ? 'tempo' : 'jog';
    }
    if (e - d === 1) { type = 'rest'; km = 0; memo = '休養・最終準備。早めに就寝。'; }
    else if (e - d === 2 && type !== 'rest') { type = 'jog'; km = 3; memo = '体をほぐす程度に軽く'; }
    else if (type !== 'rest') memo = menuMemo(type, km, phase);

      durationSec: null, memo, phase, source: 'plan' });

    durationSec: base ? Math.round(base.paceSec * p.distanceKm) : null, memo: '大会当日', phase: 'race', source: 'plan' });

}

/* 生成結果を既存の練習記録へ反映。手動編集した日・完了済みの日は上書きしない */
function mergePlan(existing, items, eventId, overwrite, newId, shoeId, source) {

  const mine = existing.filter(w => w.eventId === eventId);
  const others = existing.filter(w => w.eventId !== eventId);

  if (overwrite) kept = mine.filter(w => !((w.source === 'plan' || w.source === 'menu') && !w.done && !w.manual));
  const taken = new Set(kept.map(w => w.date));

  items.forEach(it => {

/* ---------------------------------------------------------------

/* 大会の想定所要時間（目標タイムが無いときは中級者の目安で推定） */

/* 日ごとのひとことアドバイス（練習用） */

  }
  const wear = wearAdvice(weather, w.type === 'race' ? 'race' : 'train');

    if (h.times.length) cards.push({ kind: 'hydration', title: '水分', text: '走行中は約' + h.intervalMin + '分ごとに' + h.ml[0] + '〜' + h.ml[1] + 'mlを目安に。' + (h.hot ? '暑いので回数を増やしましょう。' : '') + TEXT.drinkCaution });
    else cards.push({ kind: 'hydration', title: '水分', text: '走る約2時間前から少しずつ飲んでおく。' + TEXT.drinkCaution });

  } else cards.push({ kind: 'hydration', title: '水分', text: TEXT.hydrationDaily.lines[0] });

/* ---------------------------------------------------------------
   シューズ（画面から独立した集計・判定）
   --------------------------------------------------------------- */

}

/* ---------------------------------------------------------------
   天気（Open-Meteo）。設定オン＋同意が無ければ、通信コードは動かない

  codeToSky(code) { const m = CONFIG.weather.codeMap.find(r => code >= r.from && code <= r.to); return m ? m.sky : 'cloudy'; },
  windLabel(ms) { return ms >= CONFIG.weather.strongWindMs ? 'strong' : 'weak'; },
  /* 予報を取得できる日か。{ok, message} */

    if (d < 0) return { ok: false, message: '過去の日は取得できません。手入力できます。' };

    finally { clearTimeout(timer); }
  },

    });
  },
  _cache() { try { return JSON.parse(localStorage.getItem(CONFIG.weatherCacheKey) || '{}') || {}; } catch (e) { return {}; } },
  _saveCache(c) { try { localStorage.setItem(CONFIG.weatherCacheKey, JSON.stringify(c)); } catch (e) { /* 無視 */ } },
  clearCache() { try { localStorage.removeItem(CONFIG.weatherCacheKey); } catch (e) { /* 無視 */ } },

    const cache = Weather._cache(), hit = cache[key];

/* ---------------- 保存・読み込み ---------------- */
function save() {
  try { localStorage.setItem(CFG.storageKey, JSON.stringify(S)); return true; }
  catch (e) { toast('保存できませんでした（ブラウザの保存容量や設定を確認してください）。'); return false; }
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(CFG.storageKey); } catch (e) { raw = null; }
  if (raw) { try { S = RE.sanitizeState(JSON.parse(raw)); return; } catch (e) { /* 壊れていたらサンプルに戻す */ } }
  S = seed(); syncShoePacking(); save();
}
function seed() {
  const t = RE.todayStr(), evDate = RE.addDays(t, 84);
  const st = RE.sanitizeState({});
  st.shoes = [
    { id: 's_sample1', name: 'サンプル：デイリートレーナー', brand: '', use: 'training', purchaseDate: t, initialKm: 120, limitKm: 600, status: 'active', memo: 'これはサンプルです。編集・削除できます。' },
    { id: 's_sample2', name: 'サンプル：レース用シューズ', brand: '', use: 'race', purchaseDate: t, initialKm: 0, limitKm: 500, status: 'active', memo: '大会で履く想定のサンプル。' }
  ];
  const ev = { id: 'e_sample', name: 'サンプル：ハーフマラソン', date: evDate, type: 'half', distanceKm: 21.0975, goalSec: 7200, place: '', placeGeo: null, startTime: '09:00', shoeId: 's_sample2', weather: null, result: null };
  st.events = [ev]; st.currentEventId = ev.id;
  const plan = RE.generatePlan({ startDate: t, eventDate: evDate, distanceKm: ev.distanceKm, goalSec: ev.goalSec, level: 'intermediate', daysPerWeek: 3, currentWeeklyKm: 15 });
  st.workouts = plan.error ? [] : RE.mergePlan([], plan.items, ev.id, true, () => uid('w'), 's_sample1').workouts;
  st.dayItems = [
    { id: uid('d'), eventId: ev.id, time: '06:00', title: '朝食（サンプル）', memo: '' },
    { id: uid('d'), eventId: ev.id, time: '07:30', title: '移動（サンプル）', memo: '' },
    { id: uid('d'), eventId: ev.id, time: '09:00', title: 'スタート', memo: '' }
  ];
  st.packing = [
    { id: uid('p'), eventId: ev.id, text: 'ゼッケン・参加案内', checked: false, auto: null },
    { id: uid('p'), eventId: ev.id, text: '補給食（練習で試したもの）', checked: false, auto: null }
  ];
  st.settings = RE.sanitizeSettings({}); st.settings.defaultShoeId = 's_sample1';
  return st;
}
const cur = () => S.events.find(e => e.id === S.currentEventId) || S.events[0] || null;
function syncShoePacking() {
  S.events.forEach(ev => {
    const old = S.packing.find(p => p.eventId === ev.id && p.auto === 'shoe');
    S.packing = S.packing.filter(p => !(p.eventId === ev.id && p.auto === 'shoe'));
    const sh = ev.shoeId && S.shoes.find(s => s.id === ev.shoeId);
    if (sh) S.packing.unshift({ id: old ? old.id : uid('p'), eventId: ev.id, text: 'シューズ：' + sh.name, checked: old ? old.checked : false, auto: 'shoe' });
  });
}

let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4000); }
function openSheet(title, html, refresh) {

    '<div class="sheet-head"><h2>' + esc(title) + '</h2><button type="button" class="btn ghost" data-act="closeSheet" aria-label="閉じる">✕ 閉じる</button></div><div class="sheet-body">' + html + '</div></div>';
  $('#sheet').hidden = false; document.body.classList.add('modal-open');
  sheetRefresh = refresh || null; if (sheetRefresh) sheetRefresh(null);
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('modal-open'); sheetRefresh = null; }
function shoeOptions(selId, allowRetiredSel) {
  let h = opt('', '未選択', selId);
  S.shoes.filter(s => s.status !== 'retired' || (allowRetiredSel && s.id === selId)).forEach(s => { h += opt(s.id, s.name, selId); });

const noteFor = w => w ? (w.source === 'auto' ? '自動取得' : '手入力') : '';
function dtTxt(ms) { const d = new Date(ms); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + RE.pad(d.getHours()) + ':' + RE.pad(d.getMinutes()); }
function wxSummary(w) {
  if (!w) return '';
  const parts = [];
  if (w.temp != null) parts.push(w.temp + '℃'); else if (w.level) parts.push(CFG.levelTempLabels[w.level]);
  if (w.sky) parts.push(CFG.skyLabels[w.sky]); if (w.wind) parts.push('風：' + CFG.windLabels[w.wind]);
  return parts.join('・');
}
function wxMeta(w) {
  if (!w || !w.source) return '';
  return (w.source === 'auto' ? '🛰 自動取得' : '✍ 手入力') + (w.at ? '（' + dtTxt(w.at) + '）' : '');
}
function numParse(s) { const t = String(s == null ? '' : s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[−ー－]/g, '-').replace(/．/g, '.').trim(); if (t === '') return null; const v = parseFloat(t); return isNaN(v) ? null : v; }

/* 天気入力欄（手入力が基本。自動取得はオンのときだけボタンが出る） */
function wxFetchRow(date) {

}
function wxFields(w, kind, date, start, noFetch) {

    '<label>風<select name="wx_wind">' + opt('', '未選択', w.wind) + Object.keys(CFG.windLabels).map(k => opt(k, CFG.windLabels[k], w.wind)).join('') + '</select></label></div>' +

    '<p class="xs muted" data-role="meta">' + esc(wxMeta(w)) + '</p><div data-role="fetch">' + (noFetch ? '' : wxFetchRow(date)) + '</div></div>';

function readWx(root) {
  const box = (root || document).querySelector('.wxbox'); if (!box) return null;
  const q = n => box.querySelector('[name=' + n + ']').value;
  const temp = numParse(q('wx_temp')), sky = q('wx_sky') || null, wind = q('wx_wind') || null, level = q('wx_level') || null;
  if (temp == null && !sky && !wind && !level) return null;
  return RE.sanitizeData({ events: [{ id: 'x', date: RE.todayStr(), weather: { temp, sky, wind, level, source: box.dataset.src || 'manual', at: +box.dataset.at || Date.now() } }] }).events[0].weather;
}
async function doFetchWx(btn) {
  const box = btn.closest('.wxbox'); if (!box || !W.isEnabled(S.settings)) return;
  const kind = box.dataset.kind, ev = cur();
  const geo = kind === 'event' ? (ev && ev.placeGeo) : S.settings.homeLocation;
  const meta = box.querySelector('[data-role=meta]');
  if (!geo) { meta.textContent = kind === 'event' ? '開催場所の地名を検索して選んでください（大会の編集画面）。手入力もできます。' : '「よく走る場所」を設定画面で選んでください。手入力もできます。'; return; }
  const hasManual = box.dataset.src === 'manual' && ['wx_temp', 'wx_sky', 'wx_wind', 'wx_level'].some(n => box.querySelector('[name=' + n + ']').value);
  if (hasManual && !confirm('手入力した値があります。自動取得の結果で置き換えますか？')) return;
  btn.disabled = true; meta.textContent = '取得中…';
  try {
    const r = await W.fetchDay(geo, box.dataset.date, { startTime: kind === 'event' ? box.dataset.start : '' }, S.settings);
    box.querySelector('[name=wx_temp]').value = r.temp; box.querySelector('[name=wx_sky]').value = r.sky; box.querySelector('[name=wx_wind]').value = r.wind; box.querySelector('[name=wx_level]').value = '';
    box.dataset.src = 'auto'; box.dataset.at = r.fetchedAt; meta.textContent = wxMeta({ source: 'auto', at: r.fetchedAt }) + (r.cached ? '（保存済みの結果）' : '');
    if (sheetRefresh) sheetRefresh(null);
  } catch (e) { meta.textContent = '取得できませんでした。手入力できます。'; }
  btn.disabled = false;
}

function eventCardHtml(ev) {

  const count = d > 0 ? 'あと ' + d + ' 日' : d === 0 ? '今日が大会です！' : '大会は終了しました';
  const pace = (ev.goalSec > 0 && km) ? paceTxt(ev.goalSec / km) : '';
  const sh = S.shoes.find(s => s.id === ev.shoeId);
  return '<div class="card hero"><h2>' + esc(ev.name) + '</h2><p class="muted">' + esc(RE.fmtFull(ev.date)) + '</p><div class="count">' + count + '</div></div>' +
    '<div class="card"><dl class="kv"><dt>種目</dt><dd>' + esc(CFG.eventTypes[ev.type].label) + (km ? '（' + RE.formatKm(km) + 'km）' : '') + '</dd>' +
    '<dt>目標タイム</dt><dd>' + (ev.goalSec > 0 ? esc(RE.formatDuration(ev.goalSec)) : '未設定') + '</dd>' +
    '<dt>目標ペース</dt><dd>' + (pace ? esc(pace) : '—') + '</dd>' +
    '<dt>スタート</dt><dd>' + (ev.startTime ? esc(ev.startTime) : '未設定') + '</dd>' +
    '<dt>開催場所</dt><dd>' + (ev.place ? esc(ev.place) : '未設定') + '</dd>' +
    '<dt>大会のシューズ</dt><dd>' + (sh ? esc(sh.name) : '未設定') + '</dd></dl>' +
    '<div class="btns"><button class="btn" data-act="editEvent" data-id="' + ev.id + '">編集</button>' +
    '<button class="btn primary grow" data-act="openMenuHub">📅 練習メニューを設定</button></div></div>';
}
function signedTime(sec) {
  const a = Math.abs(Math.round(sec)), hh = Math.floor(a / 3600), m = Math.floor(a % 3600 / 60), ss = a % 60;
  return (sec < 0 ? '−' : '+') + (hh ? hh + ':' + RE.pad(m) : m) + ':' + RE.pad(ss);
}
function resultLine(ev) {
  const r = ev.result; if (!r) return '';
  if (r.status === 'dns') return '欠場'; if (r.status === 'dnf') return '途中棄権';
  let t = RE.formatDuration(r.finishSec) || '記録なし';
  if (ev.goalSec > 0 && r.finishSec > 0) t += '（目標比 ' + signedTime(r.finishSec - ev.goalSec) + (r.finishSec <= ev.goalSec ? '・達成' : '・未達') + '）';
  return t;
}
function reviewHomeCard(ev) {
  if (ev.result) return '<div class="card"><div class="row-between"><span><b>🏅 結果：</b>' + esc(resultLine(ev)) + '</span><button class="btn small" data-act="reviewOpen" data-id="' + ev.id + '">振り返りを見る</button></div></div>';
  if (ev.date <= RE.todayStr()) return '<div class="card notice-info"><p><b>お疲れさまでした！</b> 結果を入力して振り返りましょう。</p><button class="btn primary" data-act="openResult" data-id="' + ev.id + '">📝 結果を入力する</button></div>';
  return '';
}

let lastAuto = '', sheetEventId = null;
/* イベント名が登録済み（カタログ／過去の自分の大会）と一致したら、開催日・スタート時刻などを入れる */
function lookupAutofill(f, selfId) {
  const n = f.name.value, key = RE.normName(n), note = $('#autoNote');
  const r = RE.lookupEvent(n, S.events, RE.todayStr(), selfId, EF.entries(S.settings));
  if (!r) { lastAuto = ''; note.innerHTML = ''; return; }
  if (key === lastAuto) return;
  lastAuto = key;
  const x = r.fields, filled = [];
  if (x.date) { f.date.value = x.date; filled.push('開催日 ' + RE.fmtFull(x.date)); }
  if (x.startTime) { f.start.value = x.startTime; filled.push('スタート ' + x.startTime); }
  if (x.type) { f.type.value = x.type; filled.push('種目 ' + CFG.eventTypes[x.type].label); if (x.type === 'fun' && x.distanceKm) f.dist.value = x.distanceKm; }
  if (x.place && !f.place.value.trim()) { f.place.value = x.place; filled.push('開催場所 ' + x.place); }
  note.innerHTML = '<div class="card notice-info" role="status"><p>ℹ️ 「' + esc(r.label) + '」の登録情報から入力しました。</p>' + (filled.length ? '<p class="small">' + esc(filled.join('／')) + '</p>' : '') +
    r.notes.map(t => '<p class="small">' + esc(t) + '</p>').join('') + '<p class="small"><b>開催日・スタート時刻は変更されることがあります。公式サイトで必ず確認してください。</b></p>' +
    (r.url ? '<p class="small"><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">公式・参考ページを開く（外部サイト）</a></p>' : '') + '</div>';
}

function saveEvent(id) {
  const f = fm('#ef'); const name = f.name.value.trim() || '無題の大会';
  if (!RE.isValidDate(f.date.value)) return toast('開催日を入力してください。');
  const type = f.type.value; let km = CFG.eventTypes[type].km;
  if (type === 'fun') { km = RE.parseKm(f.dist.value); if (!km) return toast('距離(km)を入力してください。'); }
  let goal = null; if (f.goal.value.trim()) { goal = RE.parseDuration(f.goal.value); if (!goal) return toast('目標タイムの形式を確認してください（例：1:59:30）。'); }
  const geoBox = placeBoxes.evplace, ev = id ? S.events.find(e => e.id === id) : { id: uid('e'), weather: null, result: null };
  const oldPlace = ev.place;
  Object.assign(ev, { name, date: f.date.value, type, distanceKm: km, goalSec: goal, startTime: f.start.value || '', place: f.place.value.trim(), shoeId: f.shoe.value || null });
  if (geoBox && geoBox.geo && W.isEnabled(S.settings)) { ev.placeGeo = geoBox.geo; if (!ev.place) ev.place = geoBox.geo.name; }
  else if (oldPlace !== ev.place && !geoBox.geo) ev.placeGeo = null;
  if (!id) { S.events.push(ev); S.currentEventId = ev.id; }
  syncShoePacking(); save(); closeSheet(); render();
}

function careSample() {
  const f = fm('#cf'), s = MTX.sampleCare; if (!f) return;
  Object.keys(s.weekly).forEach(k => { const i = RE.WD_JA.indexOf(k); if (i >= 0) f['c' + i].value = s.weekly[k]; });
  f.ex.value = s.exercises.map(x => [x.name, x.detail, x.how].join('｜')).join('\n');
}
function careSave() {
  const ev = cur(), f = fm('#cf'); if (!ev || !f) return; const weekly = {};
  for (let i = 0; i < 7; i++) { const v = f['c' + i].value.trim(); if (v) weekly[RE.WD_JA[i]] = v; }
  const exercises = f.ex.value.split(/\r?\n/).map(l => l.split(/[｜|]/).map(x => x.trim())).filter(c => c[0]).map(c => ({ name: c[0], detail: c[1] || '', how: c.slice(2).join('｜') }));
  S.menus[ev.id] = RE.sanitizeMenu({ name: f.name.value, care: { weekly, exercises } }); save(); closeSheet(); render(); toast('ケア・補強の設定を保存しました。');
}

/* ---------------- 練習スケジュール ---------------- */
function workoutCard(w) {
  const km = w.distanceKm, rest = w.type === 'rest';
  let h = '<div class="card tap' + (w.done ? ' is-done' : '') + (RE.isQuality(w.type) ? ' is-quality' : '') + '" role="button" tabindex="0" data-act="editW" data-id="' + w.id + '"><div class="wk-line"><span class="badge t-' + w.type + '">' + CFG.menuTypes[w.type] + '</span>';
  if (!rest) h += '<span class="wk-main">' + (km ? RE.formatKm(km) + 'km' : '') + '</span><span class="wk-sub">' + esc(paceTxt(w.paceSec)) + (w.durationSec ? '　' + esc(RE.formatDuration(w.durationSec)) : '') + '</span>';
  if (w.done) h += '<span class="status lv-ok">✅ 完了</span>';
  h += '</div>';
  if (w.done && (w.actualDistanceKm || w.actualDurationSec)) {
    const ak = w.actualDistanceKm || km, ad = w.actualDurationSec;
    h += '<div class="wk-sub">実績：' + (ak ? RE.formatKm(ak) + 'km' : '') + (ad ? '　' + esc(RE.formatDuration(ad)) : '') + (ak && ad ? '　' + esc(paceTxt(ad / ak)) : '') + '</div>';
  }
  if (w.memo) h += '<div class="wk-sub">' + esc(w.memo) + '</div>';
  if (w.strength) h += '<div class="wk-sub wk-strength">🦵 ' + esc(w.strength) + '</div>';
  if (!rest) h += '<div class="btns"><button type="button" class="btn small' + (w.done ? '' : ' primary') + '" data-act="toggleDone" data-id="' + w.id + '">' + (w.done ? '完了を外す' : '✓ 完了にする') + '</button></div>';
  return h + '</div>';
}
function viewTrain() {
  const ev = cur(); let h = '<div class="topbar"><h1>📅 練習</h1><span class="btns"><button class="btn small" data-act="openMenuHub">📋 メニュー</button><button class="btn small" data-act="addW" data-date="' + RE.todayStr() + '">＋ 追加</button></span></div>';
  if (!ev) return h + '<div class="card center"><p>まず大会を登録してください。</p><button class="btn primary" data-act="newEvent">大会を登録する</button></div>';
  const ws = ui.weekStart, we = RE.addDays(ws, 6), list = S.workouts.filter(w => w.eventId === ev.id && w.date >= ws && w.date <= we);
  const nonRace = list.filter(w => w.type !== 'race' && w.type !== 'rest');
  const planned = nonRace.reduce((a, w) => a + (w.distanceKm || 0), 0), done = nonRace.filter(w => w.done).reduce((a, w) => a + RE.recordKm(w), 0);
  const pct = planned > 0 ? Math.round(done / planned * 100) : 0;
  h += '<div class="weeknav"><button class="btn small" data-act="weekMove" data-d="-7" aria-label="前の週">◀</button><div class="label">' + esc(RE.fmtMD(ws)) + ' 〜 ' + esc(RE.fmtMD(we)) + '<br><button class="btn small ghost" data-act="weekToday">今週へ</button></div><button class="btn small" data-act="weekMove" data-d="7" aria-label="次の週">▶</button></div>';
  const wkInfo = RE.menuWeeks(RE.workoutsToItems(S.workouts, ev.id)).find(x => x.start === ws);
  if (wkInfo && (wkInfo.phase || wkInfo.recovery)) h += '<p class="small">' + (wkInfo.phase ? '<span class="badge">' + esc(wkInfo.phase) + '</span> ' : '') + (wkInfo.recovery ? '<span class="badge">回復週</span>' : '') + '</p>';
  h += '<div class="card"><div class="row-between"><span>今週の計画 <b>' + RE.formatKm(planned) + 'km</b></span><span>実績 <b>' + RE.formatKm(done) + 'km</b></span><span>達成率 <b>' + pct + '%</b></span></div>' +
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.min(100, pct) + '" aria-label="週間達成率"><span class="progress-fill" style="width:' + Math.min(100, pct) + '%"></span></div></div>';
  const today = RE.todayStr();
  for (let i = 0; i < 7; i++) {
    const d = RE.addDays(ws, i), ds = list.filter(w => w.date === d);
    h += '<div class="day-head"><span class="d">' + esc(RE.fmtMD(d)) + (d === today ? ' <span class="badge today">今日</span>' : '') + (d === ev.date ? ' <span class="badge t-race">大会</span>' : '') + '</span><button class="btn small ghost" data-act="addW" data-date="' + d + '">＋</button></div>';
    const care = RE.careLine(S.menus[ev.id], d); if (care && !ds.some(w => w.strength)) h += '<div class="care-line">🦶 ' + esc(care) + '</div>';
    h += ds.length ? ds.map(workoutCard).join('') : '<div class="empty-day">予定なし</div>';

  return h + trainFooter(ev) + '<p class="disclaimer">' + esc(TX.planDisclaimer) + '</p>';
}
function openWorkout(id, presetDate) {

    '<label>メニュー<select name="type">' + Object.keys(CFG.menuTypes).map(k => opt(k, CFG.menuTypes[k], w.type)).join('') + '</select></label>' +
    '<p class="xs muted">距離・ペース・時間のうち2つを入れると、残りが自動で入ります。</p>' +

    '<div id="actualBox" class="card" hidden><h4>実績</h4><div class="grid2"><label>走った距離(km)<input name="akm" inputmode="decimal" value="' + esc(RE.formatKm(w.actualDistanceKm)) + '"></label>' +

    '<div class="btns"><button class="btn primary grow" data-act="saveW" data-id="' + (id || '') + '">保存</button>' + (isNew ? '' : '<button class="btn danger" data-act="deleteW" data-id="' + id + '">削除</button>') + '</div></form>';
  const fmt = { km: RE.formatKm, pace: RE.formatPace, dur: RE.formatDuration };

    const f = fm('#wf'); if (!f) return;

      ['km', 'pace', 'dur'].forEach(k => { if (k !== n && r[k] && r[k] !== v[k]) f[k].value = fmt[k](r[k]); });

    const ak = RE.parseKm(f.akm.value) || RE.parseKm(f.km.value), ad = RE.parseDuration(f.adur.value);

    $('#advBox').innerHTML = RE.dayAdvice({ type: f.type.value, durationSec: dur, paceSec: pace }, wx).map(adviceCard).join('') + '<p class="disclaimer">' + esc(TX.disclaimer) + '</p>';
  });
}
const ICON = { wear: '👕', hydration: '💧', nutrition: '🍙' };
const adviceCard = c => '<div class="card advice"><h4>' + (ICON[c.kind] || '') + ' ' + esc(c.title) + '</h4><p>' + esc(c.text) + '</p></div>';
function saveW(id) {
  const f = fm('#wf'); if (!RE.isValidDate(f.date.value)) return toast('日付を入力してください。');
  const rest = f.type.value === 'rest', chk = [['km', f.km, RE.parseKm, '距離'], ['pace', f.pace, RE.parsePace, 'ペース'], ['dur', f.dur, RE.parseDuration, '時間'], ['akm', f.akm, RE.parseKm, '実績の距離'], ['adur', f.adur, RE.parseDuration, '実績の時間']], v = {};
  for (const c of chk) { v[c[0]] = c[1].value.trim() ? c[2](c[1].value) : null; if (c[1].value.trim() && v[c[0]] == null) return toast(c[3] + 'の形式を確認してください。'); }
  const t = rest ? { km: null, pace: null, dur: null } : RE.solveTriad({ km: v.km, pace: v.pace, dur: v.dur }, ['km', 'pace', 'dur']);
  const o = id ? S.workouts.find(x => x.id === id) : { id: uid('w'), eventId: S.currentEventId, source: 'manual', manual: true };
  Object.assign(o, { date: f.date.value, type: f.type.value, distanceKm: t.km || null, paceSec: t.pace || null, durationSec: t.dur || null, shoeId: rest ? null : (f.shoe.value || null), memo: f.memo.value.trim(), strength: f.strength.value.trim(),
    done: f.done.checked, actualDistanceKm: f.done.checked ? v.akm : null, actualDurationSec: f.done.checked ? v.adur : null, weather: readWx(f), manual: true });
  if (!id) S.workouts.push(o);
  save(); closeSheet(); ui.weekStart = RE.mondayOf(o.date); render();
}

/* ---------------- 当日のスケジュール ---------------- */
const tpad = t => (t.length === 4 ? '0' + t : t);
function raceInfo(ev) {
  const rd = RE.raceDuration(ev); if (!rd) return null;
  const temp = RE.tempFromWeather(ev.weather);
  return { rd, f: RE.fuelPlan(rd.sec, rd.paceSec), h: RE.hydrationPlan(rd.sec, temp), temp, km: RE.eventKm(ev) };
}
function paceTableHtml(ev, info) {
  const km = info.km, p = info.rd.paceSec; if (!(ev.goalSec > 0)) return '<p class="small muted">目標タイムを設定すると、5kmごとの通過予想タイムが表示されます。</p>';
  const marks = []; info.f.items.forEach(i => { if (i.km) marks.push({ km: i.km, kind: 'fuel', text: 'ここで補給（約' + i.atMin + '分）' }); });
  info.h.times.forEach(t => marks.push({ km: Math.round(t * 60 / p * 10) / 10, kind: 'water', text: 'ここで給水（約' + t + '分）' }));
  const rows = []; for (let x = 5; x < km; x += 5) rows.push(x); rows.push(km);
  let prev = 0, h = '<table class="pace-table"><thead><tr><th>地点</th><th>通過予想</th><th>補給・給水の目安</th></tr></thead><tbody>';
  rows.forEach(x => {
    const ms = marks.filter(m => m.km > prev && m.km <= x + 1e-9).sort((a, b) => a.km - b.km);
    h += '<tr><td class="num">' + (x === km && km % 5 !== 0 ? RE.formatKm(x) + 'km（ゴール）' : RE.formatKm(x) + 'km') + '</td><td class="num">' + esc(RE.formatDuration(x * p)) + '</td><td>' +
      ms.map(m => '<span class="mark ' + m.kind + '">' + (m.kind === 'fuel' ? '🍌 ' : '💧 ') + esc(m.text) + '（' + m.km + 'km付近）</span>').join('') + '</td></tr>'; prev = x;
  });
  return h + '</tbody></table><p class="xs muted">一定のペースで走った場合の想定です。' + (info.rd.estimated ? '' : '') + '</p>';
}
function addTL(ev, time, title) {
  if (S.dayItems.some(d => d.eventId === ev.id && d.time === time && d.title === title)) return false;
  S.dayItems.push({ id: uid('d'), eventId: ev.id, time, title, memo: '' }); return true;
}

  const ev = cur(); let h = '<div class="topbar"><h1>🏁 当日</h1></div>';

    } else h += adviceBlock({ title: '大会中の補給', lines: ['走る時間が約' + CFG.fuel.thresholdMin + '分以内の見込みのため、特別な補給は基本的に不要です。'] });

function saveResult(id) {
  const ev = S.events.find(e => e.id === id), f = fm('#rf'); if (!ev || !f) return;
  const status = f.status.value; let fin = null;
  if (status === 'finished') { fin = RE.parseDuration(f.finish.value); if (!fin) return toast('完走タイムを入力してください（例：1:58:42）。'); }
  const km = RE.eventKm(ev), step = CFG.review.splitStepKm, splits = []; let prev = 0;
  if (km) for (let x = step; x < km - 0.01; x += step) {
    const raw = f['sp_' + x] ? f['sp_' + x].value.trim() : ''; if (!raw) continue;
    const sec = RE.parseDuration(raw); if (!sec) return toast(RE.formatKm(x) + 'kmの通過タイムの形式を確認してください。');
    if (sec <= prev) return toast(RE.formatKm(x) + 'kmの通過タイムが、前の地点より短くなっています。');
    if (fin && sec >= fin) return toast(RE.formatKm(x) + 'kmの通過タイムが、完走タイム以上になっています。');
    splits.push({ km: x, sec }); prev = sec;
  }
  const sat = parseInt(f.sat.value, 10);
  ev.result = { status, finishSec: fin, rank: f.rank.value.trim(), weather: readWx(f), shoeId: f.shoe.value || null, satisfaction: sat >= 1 && sat <= 5 ? sat : null, splits,
    pacing: f.pacing.value.trim(), fuel: f.fuel.value.trim(), wear: f.wear.value.trim(), good: f.good.value.trim(), improve: f.improve.value.trim(), next: f.next.value.trim(), memo: f.memo.value.trim() };

}

function feedStatusText() {
  const f = S.settings.eventFeed, u = EF.validateUrl(f.url);
  if (!u) return '取得元のURLが未設定です（設定画面で入力してください）。';
  const c = EF.cache();
  if (!c || c.url !== u) return '未取得です。ボタンを押したときだけ通信します。';
  return '取得済み ' + c.events.length + '件' + (c.updatedAt ? '（取得元の更新日 ' + c.updatedAt + '）' : '') + '／最終取得 ' + dtTxt(c.fetchedAt);
}
function feedRowHtml() {
  if (!EF.isEnabled(S.settings)) return '';
  return '<div class="row-between"><span class="xs muted" data-role="feedStatus">' + esc(feedStatusText()) + '</span><button type="button" class="btn small" data-act="feedFetch">🛰 大会情報を更新</button></div>';
}
function refreshNames() {
  const dl = $('#evNames'); if (dl) dl.innerHTML = RE.suggestNames(S.events, EF.entries(S.settings)).map(n => '<option value="' + esc(n) + '"></option>').join('');
}
const FEED_SAMPLE = '{\n  "version": 1,\n  "updatedAt": "2026-10-14",\n  "events": [\n    {\n      "name": "神戸マラソン",\n      "aliases": ["Kobe Marathon"],\n      "date": "2026-11-15",\n      "startTime": "09:00",\n      "type": "full",\n      "place": "神戸市",\n      "url": "https://www.kobe-marathon.net/",\n      "note": "公式サイトで確認してください"\n    }\n  ]\n}\n// type: full / half / 10k / 5k / fun（funのときは distanceKm も指定）';
function feedCardHtml() {
  const on = EF.isEnabled(S.settings), f = S.settings.eventFeed;
  let h = '<div class="card"><div class="switch-row"><label class="check" style="margin:0"><input type="checkbox" id="feedSwitch" data-act-change="toggleFeed"' + (on ? ' checked' : '') + '> 大会情報の自動取得</label></div>' +
    '<p class="xs muted">オンにすると、あなたが設定した取得元（https のURL）から大会の一覧を読み込み、イベント名の入力で開催日・スタート時刻などを自動入力できます。「大会情報を更新」を押したときだけ通信し、入力した大会名は送信しません。</p>';
  if (on) h += '<label>取得元のURL（JSON）<input id="feedUrl" inputmode="url" value="' + esc(f.url) + '" placeholder="https://raw.githubusercontent.com/…/events.json"></label>' +
    '<div class="btns"><button class="btn small" data-act="feedSaveUrl">URLを保存</button><button class="btn small primary" data-act="feedFetch">🛰 大会情報を更新</button></div>' +
    '<p class="small" data-role="feedStatus">' + esc(feedStatusText()) + '</p>' +
    '<details><summary class="small">取得元JSONの形式を見る</summary><pre class="code">' + esc(FEED_SAMPLE) + '</pre><p class="xs muted">GitHubに置いたJSONの「raw」のURLなどが使えます。取得元は、他のサイトからの読み取り（CORS）を許可している必要があります。</p></details>' +
    '<div class="btns"><button class="btn danger small" data-act="clearFeed">取得した大会情報を削除</button></div>';
  return h + '</div>';
}
function openFeedConsent() {
  openSheet('大会情報の自動取得について', '<ul><li>大会情報を取得するため、あなたが設定した取得元のURL（https）にアクセスします。アクセス先には、通常のWebアクセスと同様に、IPアドレスや端末の情報が伝わります。</li><li>入力した大会名は送信しません。取得した一覧を、この端末の中で照合します。</li><li>取得元の内容や利用条件は、取得元の運営者が定めるものです。確認と利用は自己責任で行ってください。</li><li>開催日・スタート時刻などは、正確性が保証されません。必ず公式サイトで確認してください。</li><li>いつでもオフに戻せます。</li></ul>' +
    '<label class="check"><input type="checkbox" id="feedConsentChk"> 上記を理解し、同意します</label><div class="btns"><button class="btn primary grow" id="feedConsentOk" data-act="feedConsentOk" disabled>同意してオンにする</button><button class="btn" data-act="feedConsentNo">キャンセル</button></div>');
}
async function doFeedFetch(btn) {
  if (!EF.isEnabled(S.settings)) return;
  const setS = t => document.querySelectorAll('[data-role=feedStatus]').forEach(x => { x.textContent = t; });
  btn.disabled = true; setS('取得中…');
  try {
    await EF.fetchFeed(S.settings); setS(feedStatusText()); refreshNames();
    if (fm('#ef') && !lastAuto) lookupAutofill(fm('#ef'), sheetEventId);
  } catch (e) {
    const m = e && e.message;
    setS(m === 'nourl' ? '取得元のURL（https://…）を設定画面で入力してください。' : m === 'format' ? '取得元の形式が正しくありません。' : m === 'toolarge' ? 'データが大きすぎます。' : '取得できませんでした。登録済みの大会はそのまま使えます。');
  }
  btn.disabled = false;
}

/* ---------------- 設定 ---------------- */
function viewSettings() {
  const st = S.settings, on = W.isEnabled(st);
  let h = '<div class="topbar"><h1>⚙️ 設定</h1></div><p class="small muted">このアプリは初期状態では外部と通信しません。</p>';
  h += '<div class="card"><div class="switch-row"><label class="check" style="margin:0"><input type="checkbox" id="wxSwitch" data-act-change="toggleWeather"' + (on ? ' checked' : '') + '> 天気の自動取得</label></div>' +
    '<p class="xs muted">オンにすると、入力した地名や位置情報が外部の天気サービス（Open-Meteo）に送信されます。「天気を取得」ボタンを押したときだけ通信します。</p>';
  if (on) h += '<h4>よく走る場所（練習日の天気に使用）</h4>' + placeBoxHtml('home', st.homeLocation, g => { S.settings.homeLocation = g; save(); }) +
    '<div class="btns"><button class="btn danger small" data-act="clearWx">保存した取得結果・位置情報を削除</button></div>';
  else if (st.homeLocation) h += '<div class="btns"><button class="btn danger small" data-act="clearWx">保存した取得結果・位置情報を削除</button></div>';
  h += '</div>' + feedCardHtml() + '<div class="card"><label>標準のシューズ（新しい記録に最初から選ばれます）<select data-act-change="defShoe">' + shoeOptions(st.defaultShoeId, true) + '</select></label></div>';
  h += '<h3>データの書き出し・読み込み</h3><div class="card"><label class="check"><input type="checkbox" id="expLoc"> 位置情報・地名を含める（初期値は含めない）</label>' +
    '<div class="btns"><button class="btn" data-act="exportData">⬇ JSONを書き出す</button><button class="btn" data-act="importPick">⬆ JSONを読み込む</button></div>' +
    '<input type="file" id="importFile" accept=".json,application/json" hidden><p class="xs muted">読み込みでは設定（天気の自動取得など）は変わりません。自動取得は、読み込んだ人が自分でオンにします。</p></div>';
  h += '<div class="card"><div class="btns"><button class="btn danger small" data-act="resetAll">すべてのデータを削除してサンプルに戻す</button></div></div>';
  return h + '<p class="disclaimer">' + esc(TX.disclaimer) + '</p>';
}
function openConsent() {
  openSheet('天気の自動取得について', '<ul><li>天気の取得のために、入力した地名や位置情報を、外部の天気サービス（Open-Meteo）に送信します。</li><li>Open-Meteoの利用条件（非商用の範囲、アクセス回数の目安など）は、利用する本人が確認し、自己責任で利用してください。</li><li>予報の内容や精度は保証されません。取得結果にかかわらず、ウエアや安全面の最終判断は本人が行ってください。</li><li>いつでもオフに戻せます。</li></ul>' +
    '<label class="check"><input type="checkbox" id="consentChk"> 上記を理解し、同意します</label><div class="btns"><button class="btn primary grow" id="consentOk" data-act="consentOk" disabled>同意してオンにする</button><button class="btn" data-act="consentNo">キャンセル</button></div>');
}
function doExport() {
  const data = RE.exportData(S, $('#expLoc').checked), blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'running-event-' + RE.todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(data.includesLocation ? '位置情報・地名を含めて書き出しました。' : '位置情報・地名は含めずに書き出しました。');
}
function doImport(file) {
  const rd = new FileReader();
  rd.onerror = () => toast('ファイルを読み込めませんでした。');
  rd.onload = () => {
    const r = RE.parseImport(String(rd.result)); if (r.error) return toast(r.error);
    if (!confirm('大会' + r.counts.events + '件・練習' + r.counts.workouts + '件・シューズ' + r.counts.shoes + '足を読み込みます。現在のデータは置き換わります（設定は変わりません）。よろしいですか？')) return;
    Object.assign(S, r.data); const s = S.settings; if (s.defaultShoeId && !S.shoes.some(x => x.id === s.defaultShoeId)) s.defaultShoeId = null;
    syncShoePacking(); save(); render(); toast('読み込みました。');
  };
  rd.readAsText(file);
}
function clearWeatherData() {
  if (!confirm('保存した天気の取得結果と位置情報（よく走る場所・大会の位置）を削除します。よろしいですか？')) return;
  W.clearCache(); S.settings.homeLocation = null; S.events.forEach(e => { e.placeGeo = null; if (e.weather && e.weather.source === 'auto') e.weather = null; });
  S.workouts.forEach(w => { if (w.weather && w.weather.source === 'auto') w.weather = null; }); save(); render(); toast('削除しました。');
}

/* ---------------- 描画・イベント ---------------- */
const TABS = [['home', '🏃', '大会'], ['train', '📅', '練習'], ['day', '🏁', '当日'], ['review', '🏅', '振り返り'], ['shoes', '👟', 'シューズ'], ['settings', '⚙️', '設定']];
function render() {
  const views = { home: viewHome, train: viewTrain, day: viewDay, review: viewReview, shoes: viewShoes, settings: viewSettings };
  $('#main').innerHTML = views[ui.tab]();
  $('#nav').innerHTML = TABS.map(t => '<button data-act="goTab" data-tab="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '><span class="ico" aria-hidden="true">' + t[1] + '</span>' + t[2] + '</button>').join('');
}
const actions = {
  goTab: el => { ui.tab = el.dataset.tab; if (ui.tab === 'review') ui.reviewId = null; render(); window.scrollTo(0, 0); },
  openResult: el => openResult(el.dataset.id), saveResult: el => saveResult(el.dataset.id),
  deleteResult: el => { const ev = S.events.find(e => e.id === el.dataset.id); if (ev && confirm('この大会の結果と振り返りを削除します。よろしいですか？')) { ev.result = null; save(); closeSheet(); render(); } },
  reviewOpen: el => { ui.tab = 'review'; ui.reviewId = el.dataset.id; render(); window.scrollTo(0, 0); },
  reviewBack: () => { ui.reviewId = null; render(); window.scrollTo(0, 0); },
  closeSheet,
  newEvent: () => eventSheet(null), editEvent: el => eventSheet(el.dataset.id), saveEvent: el => saveEvent(el.dataset.id || null), deleteEvent: el => deleteEvent(el.dataset.id),
  openPlanGen, previewPlan, applyPlan,
  openMenuHub, openMenuImport, menuPreview, menuApply, openMenuBuilder, openCareEdit, careSave, careSample, menuExport,
  menuPickFile: () => $('#menuFile').click(), menuSample: () => { const f = fm('#mf'); if (f) f.text.value = MTX.csvExample; },
  bdPrev: () => bdMove(-1), bdNext: () => bdMove(1), bdCopy, bdClear, bdSave,
  weekMove: el => { ui.weekStart = RE.addDays(ui.weekStart, +el.dataset.d); render(); }, weekToday: () => { ui.weekStart = RE.mondayOf(RE.todayStr()); render(); },
  addW: el => openWorkout(null, el.dataset.date), editW: el => openWorkout(el.dataset.id), saveW: el => saveW(el.dataset.id || null),
  deleteW: el => { if (confirm('この練習の記録を削除します。よろしいですか？')) { S.workouts = S.workouts.filter(w => w.id !== el.dataset.id); save(); closeSheet(); render(); } },
  toggleDone: (el, e) => { e.stopPropagation(); const w = S.workouts.find(x => x.id === el.dataset.id); if (w) { w.done = !w.done; save(); render(); } },
  fetchWx: el => doFetchWx(el), placeSearch, placeHere, placePick: el => { const box = el.closest('.placebox'); placePicked(box, placeBoxes[box.dataset.id].results[+el.dataset.i]); },
  addTL: () => openTL(null), editTL: el => openTL(el.dataset.id),
  saveTL: el => { const f = fm('#tf'); if (!/^\d{2}:\d{2}$/.test(f.time.value)) return toast('時刻を入力してください。'); const id = el.dataset.id, x = id ? S.dayItems.find(d => d.id === id) : { id: uid('d'), eventId: S.currentEventId };
    Object.assign(x, { time: f.time.value, title: f.title.value.trim() || '予定', memo: f.memo.value.trim() }); if (!id) S.dayItems.push(x); save(); closeSheet(); render(); },
  deleteTL: el => { S.dayItems = S.dayItems.filter(d => d.id !== el.dataset.id); save(); closeSheet(); render(); },
  addTLfrom: el => { toast(addTL(cur(), el.dataset.time, el.dataset.title) ? 'タイムラインに追加しました。' : 'すでに追加されています。'); save(); render(); },
  addBasicTL: () => { const ev = cur(); let n = 0; [[-240, '起床'], [-180, '朝食'], [-120, '移動'], [-90, '受付'], [-60, '荷物預け'], [0, 'スタート']].forEach(a => { if (addTL(ev, RE.timeAddHours(ev.startTime, a[0]), a[1])) n++; }); save(); render(); toast(n + '件追加しました。時刻は目安なので、編集してください。'); },
  addFuelTL: () => { const ev = cur(), info = raceInfo(ev); let n = 0; info.f.items.forEach(i => { if (addTL(ev, RE.timeAddHours(ev.startTime, i.atMin), '補給' + (i.km ? '（約' + i.km + 'km）' : ''))) n++; }); save(); render(); toast(n + '件追加しました。'); },
  togglePack: el => { const p = S.packing.find(x => x.id === el.dataset.id); if (p) { p.checked = !p.checked; save(); render(); } },
  delPack: el => { S.packing = S.packing.filter(x => x.id !== el.dataset.id); save(); render(); },
  addPack: () => { const t = $('#packNew').value.trim(); if (!t) return; S.packing.push({ id: uid('p'), eventId: S.currentEventId, text: t, checked: false, auto: null }); save(); render(); },
  packWear: () => { const ev = cur(), a = RE.wearAdvice(ev.weather, 'race'); if (!a) return; let n = 0; a.packable.forEach(t => { if (!S.packing.some(p => p.eventId === ev.id && p.text === t)) { S.packing.push({ id: uid('p'), eventId: ev.id, text: t, checked: false, auto: null }); n++; } }); save(); render(); toast(n + '件を持ち物に追加しました。'); },
  editEvWx: openEvWx,
  saveEvWx: () => { const ev = cur(); ev.weather = readWx($('#xf')); save(); closeSheet(); render(); },
  newShoe: () => openShoe(null), editShoe: el => openShoe(el.dataset.id), saveShoe: el => saveShoe(el.dataset.id || null), deleteShoe: el => deleteShoe(el.dataset.id),
  consentOk: () => { S.settings.consent = { at: Date.now() }; S.settings.autoWeather = true; save(); closeSheet(); render(); toast('天気の自動取得をオンにしました。'); },
  consentNo: () => { closeSheet(); render(); },
  clearWx: clearWeatherData, feedFetch: el => doFeedFetch(el),
  feedSaveUrl: () => { const u = EF.validateUrl($('#feedUrl').value); if (!u) return toast('https:// から始まるURLを入力してください。'); S.settings.eventFeed.url = u; save(); render(); toast('URLを保存しました。「大会情報を更新」を押すと取得します。'); },
  feedConsentOk: () => { S.settings.eventFeed.consent = { at: Date.now() }; S.settings.eventFeed.enabled = true; save(); closeSheet(); render(); toast('オンにしました。取得元のURLを入力して、「大会情報を更新」を押してください。'); },
  feedConsentNo: () => { closeSheet(); render(); },
  clearFeed: () => { if (confirm('取得した大会情報を削除します。よろしいですか？')) { EF.clearCache(); render(); toast('削除しました。'); } }, exportData: doExport, importPick: () => $('#importFile').click(),
  resetAll: () => { if (confirm('すべてのデータを削除して、サンプルデータに戻します。よろしいですか？（元に戻せません）')) { W.clearCache(); EF.clearCache(); S = seed(); syncShoePacking(); save(); ui.tab = 'home'; render(); } }
};
const changes = {
  switchEvent: el => { S.currentEventId = el.value; save(); render(); },
  defShoe: el => { S.settings.defaultShoeId = el.value || null; save(); toast('標準のシューズを設定しました。'); },
  toggleFeed: el => {
    if (el.checked) { el.checked = false; openFeedConsent(); return; }
    S.settings.eventFeed.enabled = false; S.settings.eventFeed.consent = null; save(); render(); toast('オフにしました。以後は通信しません。取得済みの大会情報は、ボタンで削除できます。');
  },
  toggleWeather: el => {
    if (el.checked) { el.checked = false; openConsent(); return; }
    S.settings.autoWeather = false; S.settings.consent = null; save(); render(); toast('オフにしました。以後は通信しません。保存済みの取得結果・位置情報は、下のボタンで削除できます。');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.matches('select,input')) return;
  const a = actions[t.dataset.act]; if (a) { if (t.closest('form') && t.tagName === 'BUTTON') e.preventDefault(); a(t, e); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card.tap[role=button]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.actChange && changes[t.dataset.actChange]) return changes[t.dataset.actChange](t);
  if (t.id === 'menuFile' && t.files[0]) { const rd = new FileReader(); rd.onerror = () => toast('ファイルを読み込めませんでした。'); rd.onload = () => { const f = fm('#mf'); if (f) { f.text.value = String(rd.result).slice(0, 500000); menuPreview(); } }; rd.readAsText(t.files[0]); t.value = ''; return; }
  if (t.id === 'importFile' && t.files[0]) { doImport(t.files[0]); t.value = ''; }
  if (t.id === 'consentChk') $('#consentOk').disabled = !t.checked;
  if (t.id === 'feedConsentChk') $('#feedConsentOk').disabled = !t.checked;
  if (!$('#sheet').hidden && sheetRefresh) sheetRefresh(e);
});
document.addEventListener('input', e => {
  const t = e.target, box = t.closest && t.closest('.wxbox');
  if (box && t.name && t.name.indexOf('wx_') === 0) { box.dataset.src = 'manual'; box.dataset.at = Date.now(); box.querySelector('[data-role=meta]').textContent = wxMeta({ source: 'manual', at: Date.now() }); }
  if (!$('#sheet').hidden && sheetRefresh) sheetRefresh(e);
});

load(); render();
})();

</script>
<script>
/* オフラインで開けるようにする（https または localhost のときだけ。file:// では何もしない） */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* 失敗してもアプリは普通に使える */ }); });
}
</script>
</body>
